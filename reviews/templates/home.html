<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
</head>
<body>
    <h1>Отзывы</h1>

    {% if reviews %}
        {% for review in reviews %}
            <p>{{ review.name }}:</p>
            <p>{{ review.content }}</p>
        {% endfor %}
    {% else %}
        <p>Отзывов пока нет.</p>
    {% endif %}    
</body>
</html>
